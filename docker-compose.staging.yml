# Staging — same shape as docker-compose.yml, but running from the built
# image rather than a live bind-mount of the working tree (so staging
# actually mirrors what a real deploy runs), with production-leaning
# defaults (DEBUG off, secure cookies/HSTS on) baked in rather than left
# to fall back to dev-safe defaults.
#
# Distinct container names, project-qualified volume, and non-default host
# ports so this can run alongside the dev compose on the same machine
# without colliding. Copy env.staging.example to .env.staging and fill it
# in before use:
#
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
#
# First boot only: the scoped `travelcrm_app` role gets created
# automatically (scripts/init-scoped-role.sql), but still needs its
# password set to match SCOPED_DB_PASSWORD and its table/sequence grants
# applied once migrations have run — see scripts/README.md.

services:
  db:
    image: postgres:15-alpine
    container_name: travel_staging_db
    environment:
      POSTGRES_DB: ${DB_NAME:-travelcrm_staging}
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD must be set in .env.staging}
    ports:
      - "5433:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./scripts/init-scoped-role.sql:/docker-entrypoint-initdb.d/init-scoped-role.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travel_staging_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_staging_web
    # Single line — see docker-compose.yml's identical fix for why a
    # folded (`>`) multi-line command here silently crash-loops instead.
    command: bash -c "python manage.py migrate && gunicorn travelcrm.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8001:8000"
    environment: &web_env
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env.staging}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set in .env.staging}
      - DB_NAME=${DB_NAME:-travelcrm_staging}
      - DB_USER=${DB_USER:-travelcrm_app}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env.staging}
      - DB_HOST=db
      - DB_PORT=5432
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL must be set in .env.staging}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-True}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-3600}
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=${SECURE_HSTS_INCLUDE_SUBDOMAINS:-True}
      - SECURE_HSTS_PRELOAD=${SECURE_HSTS_PRELOAD:-False}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-True}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-True}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@example.com}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_staging_worker
    command: celery -A travelcrm worker --loglevel=info
    environment: *web_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_staging_data:
