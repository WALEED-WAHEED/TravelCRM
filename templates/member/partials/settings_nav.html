{% load i18n %}
{# Tab bar shared by every page under Settings (sidebar → Settings). #}
{% with n=request.resolver_match.url_name %}
<nav class="settings-tabs hotels-reveal" style="--d:40ms" aria-label="{% trans 'Settings sections' %}">
    <a href="{% url 'my-profile' %}" class="settings-tab{% if n == 'my-profile' %} is-active{% endif %}" {% if n == 'my-profile' %}aria-current="page"{% endif %}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        {% trans "My profile" %}
    </a>
    {% if user.role == 'member' or user.is_superuser %}
    <a href="{% url 'profile' %}" class="settings-tab{% if n == 'profile' %} is-active{% endif %}" {% if n == 'profile' %}aria-current="page"{% endif %}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg>
        {% trans "Company profile" %}
    </a>
    <a href="{% url 'attendance-settings' %}" class="settings-tab{% if n == 'attendance-settings' %} is-active{% endif %}" {% if n == 'attendance-settings' %}aria-current="page"{% endif %}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        {% trans "Attendance" %}
    </a>
    {% endif %}
</nav>
{% endwith %}
