services:
  # Backend Django API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: nahd_travels_backend
    working_dir: /app/backend
    volumes:
      #- ./backend:/app/backend
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=travelcrm.settings
      - DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}

    ports:
      - "127.0.0.1:8001:8001"
    entrypoint: ["/app/backend/docker-entrypoint.sh"]
    command: gunicorn travelcrm.wsgi:application --bind 0.0.0.0:8001
    restart: unless-stopped

  # Frontend React Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        # Use relative URL so frontend talks to nginx proxy
        VITE_API_BASE_URL: /
    container_name: nahd_travels_frontend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:

  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  default:
    name: nahd_travels_network
