version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: nahd_travels_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelcrm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: nahd_travels_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Django API
backend:
  build:
    context: .
    dockerfile: Dockerfile
    target: backend
  container_name: nahd_travels_backend
  working_dir: /app/backend
  volumes:
    - ./backend:/app/backend
    - static_volume:/app/staticfiles
    - media_volume:/app/media
  environment:
    - PYTHONPATH=/app/backend
    - DJANGO_SETTINGS_MODULE=travelcrm.settings
    - DEBUG=${DJANGO_DEBUG:-False}
    - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
    - POSTGRES_DB=${POSTGRES_DB:-travelcrm}
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    - POSTGRES_HOST=db
    - POSTGRES_PORT=5432
    - REDIS_URL=redis://redis:6379/1
  command: gunicorn travelcrm.wsgi:application --bind 0.0.0.0:8001
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

  # Celery Worker for Background Tasks
  # celery:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: backend
  #   container_name: nahd_travels_celery
  #   working_dir: /app
  #   command: bash -c "pip install -r /app/requirements.txt && python -m celery -A travelcrm worker -l info"
  #   environment:
  #     - PYTHONPATH=/app
  #     - DEBUG=${DJANGO_DEBUG:-False}
  #     - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
  #     - POSTGRES_DB=${POSTGRES_DB:-travelcrm}
  #     - POSTGRES_USER=${POSTGRES_USER:-postgres}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
  #     - POSTGRES_HOST=db
  #     - POSTGRES_PORT=5432
  #     - REDIS_URL=redis://redis:6379/1
  #     - CELERY_BROKER_URL=redis://redis:6379/0
  #     - CELERY_RESULT_BACKEND=redis://redis:6379/0
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     backend:
  #       condition: service_healthy
  #   restart: unless-stopped

  # Frontend React Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    container_name: nahd_travels_frontend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  default:
    name: nahd_travels_network
