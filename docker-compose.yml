services:
  db:
    image: postgres:15-alpine
    container_name: travel_db
    # Opt-in only: by default the app uses the Postgres installed on the host
    # (DB_HOST below). Start this one with `docker compose --profile bundled-db up`
    # and set DB_HOST=db for web/worker.
    profiles: ["bundled-db"]
    environment:
      # NOTE: docker-compose's own POSTGRES_USER always becomes a Postgres
      # *superuser*, which bypasses Row-Level Security entirely. For a
      # fresh container, create a separate scoped role (see
      # docs/README on travelcrm_app) after first boot and point the web
      # service's DB_USER/DB_PASSWORD at that role instead of this one.
      POSTGRES_DB: ${DB_NAME:-travelcrm}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Host side is configurable so it can sit next to a locally installed
      # Postgres that already owns 5432 (containers still talk on 5432).
      - "${DOCKER_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travel_redis
    ports:
      - "6379:6379"   # so a manual `runserver` / Celery worker can use it too
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_web
    # A YAML folded scalar (`>`) joins lines with spaces, not real
    # newlines — combined with the trailing `\` this silently produced a
    # broken command (bash saw a stray `&&` with nothing valid before
    # it) and crash-looped forever. One line, no continuation needed.
    command: bash -c "python manage.py migrate && gunicorn travelcrm.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      # Named volume anchored on the same subpath as collectstatic's
      # output takes precedence over the parent bind mount above and is
      # seeded from the image's already-collected files on first use —
      # without this, the `.:/app` bind mount shadows /app/staticfiles
      # with the host's (nonexistent) staticfiles/ dir, and every static
      # asset 404s at runtime even though collectstatic ran fine at
      # build time.
      - static_volume:/app/staticfiles
    ports:
      - "${DOCKER_WEB_PORT:-8000}:8000"
    environment: &web_env
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-local-dev-only-do-not-deploy}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DB_NAME=${DB_NAME:-travelcrm}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=${DOCKER_DB_HOST:-host.docker.internal}
      - DB_PORT=5432
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-0}
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      - SECURE_HSTS_PRELOAD=${SECURE_HSTS_PRELOAD:-False}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-False}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-False}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@example.com}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_worker
    command: celery -A travelcrm worker --loglevel=info
    volumes:
      - .:/app
    environment: *web_env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
